name: Auto-update IPO List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Selenium and Chrome
        run: |
          pip install selenium
          # Chrome and chromedriver are pre-installed on ubuntu-latest runners

      - name: Verify Chrome installation
        run: |
          google-chrome --version || true
          which chromedriver || true

      - name: Run scraper
        run: python scraper.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipo_list.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update IPO list ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
